profile_version: travel-grpo-verl08-v1
dynamic_sampling: true
model_path: outputs/models/sft-merged
output_dir: outputs/models/grpo
data:
  apply_chat_template_kwargs: {enable_thinking: false}
  train_files: outputs/grpo/data/train.parquet
  val_files: outputs/grpo/data/validation.parquet
  train_batch_size: 2
  val_batch_size: 2
  max_prompt_length: 4096
  max_response_length: 28672
  truncation: error
rollout:
  backend: vllm
  mode: async
  n: 4
  temperature: 0.7
  top_p: 0.9
  max_model_len: 32768
  gpu_memory_utilization: 0.55
  workers: 4
  max_parallel_calls: 1
  max_assistant_turns: 20
  format: qwen3_coder
  enable_thinking: false
validation: {n: 1, temperature: 0.0, top_p: 1.0, do_sample: false}
actor:
  lora_rank: 16
  lora_alpha: 32
  learning_rate: 1.0e-6
  mini_batch_size: 2
  micro_batch_size_per_gpu: 1
  gradient_checkpointing: true
algorithm: {adv_estimator: grpo, norm_adv_by_std_in_grpo: false, kl_in_reward: false, kl_loss: false}
turn_credit:
  enabled: false
  mode: "off"
  version: causal-turn-credit-v1
  completion_allocation:
    preference_chain: 0.20
    successful_search: 0.35
    correct_answer: 0.45
  partial_progress:
    preference_field_resolved: 0.05
    preference_chain_cap: 0.10
    normal_candidates_observed: 0.20
    visible_answer_call: 0.05
  error_adjustment:
    no_progress_action: -0.10
    semantic_repeat: -0.10
    guard_rejection_generic: -0.15
    exact_query_repeat: -0.20
    wrong_aspect: -0.20
    invisible_answer_id: -0.20
    wrong_answer: -0.15
    malformed_tool_call: -0.15
    no_tool_output: -0.15
  evidence_clip: 0.50
  mix_lambda: 0.50
  multiplier_band: 0.20
  epsilon: 1.0e-6
dynamic:
  group_size: 4
  required_groups: 2
  max_generation_batches: 3
  max_consecutive_skips: 10
  reward_tolerance: 1.0e-6
trainer: {total_training_steps: 500, save_freq: 50, test_freq: 50, val_before_train: true, logger: console}
actor_rollout_ref:
  model:
    path: ${oc.env:GRPO_ACTOR_MODEL,outputs/models/sft-merged}
  rollout:
    multi_turn:
      enable: true
      max_parallel_calls: 1
      tool_config_path: configs/tool_config/userbench_tools.yaml

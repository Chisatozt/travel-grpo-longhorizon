# [项目注释] 文件职责：定义通用 LoRA SFT trainer 参数。
model:
  base: Qwen/Qwen3.5-2B
  cache_dir: outputs/cache/huggingface
  trust_remote_code: false
  qlora: false
  torch_dtype: bfloat16

data:
  # Internal holdout derived from the frozen sft_train pool. This is suitable
  # for SFT eval_loss monitoring, not frozen-split or benchmark reporting.
  train_tasks: outputs/teacher_trajectories/sft_train.from_train_holdout.tasks.parquet
  validation_tasks: outputs/teacher_trajectories/sft_validation.from_train.tasks.parquet
  train_trajectories:
    - outputs/teacher_trajectories/sft_train.accepted.jsonl
    - outputs/teacher_trajectories/sft_train.silver.jsonl
  validation_trajectories:
    - outputs/teacher_trajectories/sft_validation.from_train.accepted.jsonl
    - outputs/teacher_trajectories/sft_validation.from_train.silver.jsonl
  accepted_quality_tiers: [gold, silver]
  # minimum_train_trajectories: 400
  # minimum_validation_trajectories: 40
  # required_compositions: ["22", "33", "44", "2222", "233", "333", "334", "444"]
  minimum_train_trajectories: 50
  minimum_validation_trajectories: 5
  required_compositions: []
  tool_schema_path: configs/tool_config/userbench_tools.yaml
  assistant_loss: action_only
  example_unit: assistant_turn
  max_sequence_length: 32768

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear

training:
  output_dir: outputs/sft/qwen3.5-2b-lora
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  optim: adamw_torch
  num_train_epochs: 3
  max_steps: -1
  gradient_checkpointing: true
  bf16: true
  fp16: false
  logging_steps: 5
  eval_strategy: steps
  eval_steps: 50
  save_strategy: steps
  save_steps: 50
  save_total_limit: 2
  seed: 42
  report_to: none

# [项目注释] 文件职责：定义 evaluation simulator 边界。
simulator:
  role: eval
  backend: openai
  model_env: EVAL_USER_SIM_MODEL
  base_url_env: EVAL_USER_SIM_BASE_URL
  api_key_env: EVAL_USER_SIM_API_KEY
  temperature: 0.0
  max_tokens: 2048
  timeout: 60.0
# Formal evaluation must never reuse the training simulator runtime.

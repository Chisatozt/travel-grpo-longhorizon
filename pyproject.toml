[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-grpo"
version = "0.1.0"
description = "Auditable UserBench travel-agent SFT, GRPO, and evaluation pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = [
  "openai>=1,<3",
  "PyYAML>=6,<7",
]
data = [
  "pyarrow==25.0.0",
  "tomli>=2,<3; python_version < '3.11'",
]
sft = [
  "accelerate>=1.2,<2",
  "peft>=0.14,<1",
  "pyarrow==25.0.0",
  "PyYAML>=6,<7",
  "torch>=2.4,<3",
  "transformers @ git+https://github.com/huggingface/transformers.git@7ea2320c76117e6742364808a666ef6f2fb40a67",
]
qlora = [
  "bitsandbytes>=0.45,<1; platform_system == 'Linux'",
]
eval = [
  "openai>=1,<3",
  "PyYAML>=6,<7",
]
grpo = [
  "verl==0.8.0; platform_system == 'Linux'",
  "vllm==0.25.1; platform_system == 'Linux'",
  "torch==2.11.0; platform_system == 'Linux'",
  "torchvision==0.26.0; platform_system == 'Linux'",
  "torchaudio==2.11.0; platform_system == 'Linux'",
  "ray[default]==2.56.1; platform_system == 'Linux'",
  "tensordict==0.10.0; platform_system == 'Linux'",
  "opencv-python-headless==4.13.0.90; platform_system == 'Linux'",
  # vLLM 0.25.1 requires OpenCV >=4.13, whose Python 3.12 wheels require
  # NumPy >=2. The setup script documents an explicit uv override for the
  # stale veRL 0.8.0 NumPy<2 metadata.
  "numpy==2.2.6; platform_system == 'Linux'",
  "transformers @ git+https://github.com/huggingface/transformers.git@7ea2320c76117e6742364808a666ef6f2fb40a67 ; platform_system == 'Linux'",
]
logging = [
  "swanlab==0.9.1; platform_system == 'Linux'",
]
dev = [
  "pytest>=8,<10",
  "PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
  "integration: explicit opt-in checks for external editable dependencies",
]

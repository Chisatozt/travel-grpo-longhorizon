[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-grpo"
version = "0.1.0"
description = "UserBench travel-agent post-training project scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = [
  "openai>=1,<3",
  "PyYAML>=6,<7",
]
data = [
  "pyarrow==25.0.0",
  "tomli>=2,<3; python_version < '3.11'",
]
dev = [
  "pytest>=8,<10",
  "PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
  "integration: explicit opt-in checks for external editable dependencies",
]

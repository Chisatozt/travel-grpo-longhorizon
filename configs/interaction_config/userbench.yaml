# [项目注释] 文件职责：定义 UserBench task/session/environment 基础参数。
environment:
  source_root: environments/UserBench
  max_steps: 20
  wrong_choice_number: 10
  noise_choice_number: 5
  one_choice_per_aspect: true
  seed: 42
  reward_scale: 1.0
  step_penalty: 0.0
  search_correct_reward: 0.2
  preference_correct_reward: 0.2
  choice_best_reward: 1.0
  choice_correct_reward: 0.8
  wrong_choice_penalty: 0.0
  normalize_rewards: false
  verbose: false
  capture_upstream_diagnostics: false
reward:
  version: userbench-travel-reward-v3-priority
  terminal_only: true
  range: [-1.0, 1.0]
  weights:
    completion: 3.0
    preference_coverage: 0.20
    phase_transition: 0.08
    search_coverage: 0.06
    answer_quality: 0.04
    efficiency: 0.02
  policy_penalties:
    guard_rejection: {cap: 0.08, events: 4}
    blocked_aspect: {cap: 0.08}
    invalid_action: {cap: 0.03, events: 4}
    parallel_tool_calls: {fixed: 0.05}
    exact_repeat: {cap: 0.02, events: 4}
    semantic_repeat: {cap: 0.02, events: 4}
    ambiguous_action: {cap: 0.02}
    unsearched_answer: {cap: 0.03}
    wrong_answer: {cap: 0.04}
    no_tool_output: {fixed: 0.02}
    max_steps: {fixed: 0.02}
  normalization:
    mode: fixed_linear
    scale: 3.4
  infrastructure_invalid_score: 0.0

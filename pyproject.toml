[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-grpo"
version = "0.1.0"
description = "UserBench travel-agent post-training project scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = [
  "openai>=1,<3",
  "PyYAML>=6,<7",
]
data = [
  "pyarrow==25.0.0",
  "tomli>=2,<3; python_version < '3.11'",
]
sft = [
  "accelerate>=1.2,<2",
  "peft>=0.14,<1",
  "PyYAML>=6,<7",
  "torch>=2.4,<3",
  "transformers>=4.57,<5",
]
qlora = [
  "bitsandbytes>=0.45,<1; platform_system == 'Linux'",
]
dev = [
  "pytest>=8,<10",
  "PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
  "integration: explicit opt-in checks for external editable dependencies",
]

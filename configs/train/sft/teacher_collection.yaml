teacher:
  backend: openai_compatible
  model: deepseek-v4-flash
  model_env: TEACHER_MODEL
  base_url_env: TEACHER_BASE_URL
  api_key_env: TEACHER_API_KEY
  thinking_env: TEACHER_THINKING
  temperature: 0.0
  max_tokens: 4096
  thought_max_chars: 200
  protocol_retries: 2
  action_retries: 3

simulator:
  config_path: configs/interaction_config/simulator_collection.yaml
  model: deepseek-v4-flash

collection:
  policy_version: teacher-state-machine-v5
  actor_policy_version: actor-runtime-v1
  train_tasks: data/sft/tasks_train.jsonl
  validation_tasks: data/sft/tasks_validation.jsonl
  frozen_evaluation_tasks: data/evaluation/tasks.jsonl
  output_root: outputs/teacher_trajectories
  max_steps: 20
  default_concurrency: 1
  trajectory_attempts: 3
  strict_filter: true
  capture_upstream_diagnostics: true
  reward_version: userbench-travel-reward-v2
  minimum_terminal_reward: 0.7
  require_zero_policy_penalty: true
  fail_fast_on_strict_violation: true
  checkpoint_each_task: true
  resume_safe: true
  silver:
    enabled: true
    max_judgment_fallbacks: 1
    max_vague_repairs: 1
    max_search_repairs: 1
    max_elicitation_repairs_per_field: 1
    minimum_raw_terminal_reward: 0.7
  artifacts:
    accepted: "*.accepted.jsonl"
    silver: "*.silver.jsonl"
    rejected: "*.rejected.jsonl"
    diagnostics: "*.diagnostics.jsonl"

# [项目注释] 文件职责：定义 stage-2 trajectory SFT 参数。
stage:
  name: complete_trajectory

model:
  base: Qwen/Qwen3.5-2B
  cache_dir: outputs/cache/huggingface
  trust_remote_code: false
  qlora: false
  torch_dtype: bfloat16

data:
  train_format: trajectory
  validation_format: trajectory
  train_tasks: outputs/teacher_trajectories/sft_train.from_train_holdout.tasks.parquet
  validation_tasks: outputs/teacher_trajectories/sft_validation.from_train.tasks.parquet
  train_trajectories:
    - outputs/teacher_trajectories/sft_train.accepted.jsonl
    - outputs/teacher_trajectories/sft_train.silver.jsonl
  validation_trajectories:
    - outputs/teacher_trajectories/sft_validation.from_train.accepted.jsonl
    - outputs/teacher_trajectories/sft_validation.from_train.silver.jsonl
  accepted_quality_tiers: [gold, silver]
  minimum_train_trajectories: 50
  minimum_validation_trajectories: 10
  required_compositions: []
  tool_schema_path: configs/tool_config/userbench_tools.yaml
  assistant_loss: action_only
  example_unit: assistant_turn
  max_sequence_length: 32768

lora:
  # Stage 2 continues the exact Stage-1 adapter; its optimizer/scheduler state
  # is intentionally reset for the complete-trajectory curriculum.
  init_from: outputs/sft/qwen3.5-2b-lora-stage1
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear

training:
  output_dir: outputs/sft/qwen3.5-2b-lora-stage2
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  optim: adamw_torch
  num_train_epochs: 3
  max_steps: -1
  gradient_checkpointing: true
  bf16: true
  fp16: false
  logging_steps: 5
  eval_strategy: steps
  eval_steps: 50
  save_strategy: steps
  save_steps: 50
  save_total_limit: 2
  seed: 42
  report_to: none
